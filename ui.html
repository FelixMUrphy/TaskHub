<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TaskHub</title>
<link rel="icon" href="/icon.png">
<style>
:root{
  --bg:#f4f5f7;--card:#fff;--fg:#1d2330;--mut:#6b7380;--line:#e3e6eb;--track:#e8ebf0;
  --blue:#2f6fed;--green:#16a34a;--red:#dc2626;--amber:#d97706;--grey:#8a919c;--violet:#7c3aed;
  --s1:#2f6fed;--s2:#e8590c;--s3:#16a34a;--s4:#9333ea;--s5:#0891b2;--s6:#ca8a04;
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#14161b;--card:#1d2027;--fg:#e6e8ec;--mut:#8d95a3;--line:#2b2f38;--track:#2c313b;
  --blue:#5b8ff9;--green:#3ccf74;--red:#f87171;--amber:#fbbf24;--grey:#7b8391;
  --s1:#5b8ff9;--s2:#ff8a4c;--s3:#3ccf74;--s4:#b57bff;--s5:#34c3e0;--s6:#f2c94c;}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.4 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif}
header{user-select:none;position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:10px 12px 8px;border-bottom:1px solid var(--line)}
header h1{font-size:14px;margin:0;font-weight:650;letter-spacing:.2px}
header .cnt{color:var(--mut);font-size:12px}
header .sp{flex:1}
.tabs{display:flex;gap:2px;background:var(--track);border-radius:7px;padding:2px}
.tabs button{border:0;background:none;color:var(--mut);padding:3px 9px;border-radius:5px;font:inherit;font-size:12px;cursor:pointer}
.tabs button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 2px #0002}
.ib{border:0;background:none;color:var(--mut);cursor:pointer;font-size:15px;padding:3px 6px;border-radius:6px}
.ib:hover{background:var(--track);color:var(--fg)}
#off{display:none;background:var(--red);color:#fff;font-size:12px;padding:4px 12px}
main{padding:10px;display:flex;flex-direction:column;gap:9px}
.empty{color:var(--mut);text-align:center;padding:50px 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 11px 9px;position:relative;border-left:3px solid var(--sc,var(--grey))}
.card.flash{animation:fl 1.4s}
@keyframes fl{0%,40%{box-shadow:0 0 0 3px var(--blue)}100%{box-shadow:none}}
.card[data-s=running]{--sc:var(--blue)} .card[data-s=paused]{--sc:var(--violet)}
.card[data-s=stale]{--sc:var(--amber)} .card[data-s=done]{--sc:var(--green)}
.card[data-s=failed],.card[data-s=lost]{--sc:var(--red)} .card[data-s=cancelled]{--sc:var(--grey)}
.hd{display:flex;align-items:center;gap:6px}
.name{font-weight:620;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.chip{font-size:10.5px;color:var(--mut);border:1px solid var(--line);border-radius:9px;padding:0 6px;white-space:nowrap}
.st{font-size:10.5px;font-weight:650;text-transform:uppercase;letter-spacing:.4px;color:var(--sc)}
.hd .sp{flex:1}
.tm{color:var(--mut);font-size:11.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.x{border:0;background:none;color:var(--mut);cursor:pointer;font-size:15px;line-height:1;padding:0 2px;visibility:hidden}
.card:not([data-active]) .x{visibility:visible}
.desc{color:var(--mut);font-size:12px;margin-top:2px}
.bar{height:6px;background:var(--track);border-radius:4px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--sc);border-radius:4px;transition:width .4s}
.bar.ind i{width:30%!important;animation:ind 1.3s infinite ease-in-out}
@keyframes ind{0%{transform:translateX(-100%)}100%{transform:translateX(340%)}}
.l1{display:flex;gap:10px;color:var(--mut);font-size:11.5px;font-variant-numeric:tabular-nums}
.l1 b{color:var(--fg);font-weight:600}
.status{margin-top:4px;word-break:break-word}
.stage{color:var(--mut);font-size:12px}
.msg{margin-top:6px;font-size:12px;padding:5px 8px;border-radius:6px;background:var(--track);word-break:break-word}
.card[data-s=failed] .msg,.card[data-s=lost] .msg{color:var(--red)}
/* widgets */
.wg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.w{background:var(--bg);border-radius:7px;padding:6px 8px;min-width:0}
.w.span2{grid-column:span 2}
.w .lb{font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:6px}
.w .lb .lv{margin-left:auto;text-transform:none;letter-spacing:0;color:var(--fg);font-variant-numeric:tabular-nums}
.w .v{font-size:13px;word-break:break-word}
.w .v.mono{font-family:var(--mono);font-size:12px;white-space:pre-wrap}
.w .big{font-size:20px;font-weight:620;font-variant-numeric:tabular-nums;line-height:1.2}
.w .big small{font-size:12px;color:var(--mut);font-weight:400;margin-left:3px}
.dl{font-size:11px;margin-left:6px} .dl.up{color:var(--green)} .dl.dn{color:var(--red)}
.w .pb{height:7px;background:var(--track);border-radius:4px;overflow:hidden;margin-top:4px}
.w .pb i{display:block;height:100%;border-radius:4px;background:var(--wc,var(--blue));transition:width .4s}
.led{display:flex;align-items:center;gap:7px}
.led i{width:10px;height:10px;border-radius:50%;background:var(--grey);flex:none}
.led i.ok{background:var(--green);box-shadow:0 0 6px var(--green)} .led i.warn{background:var(--amber);box-shadow:0 0 6px var(--amber)}
.led i.error{background:var(--red);box-shadow:0 0 6px var(--red)} .led i.busy{background:var(--blue);animation:bl 1s infinite}
@keyframes bl{50%{opacity:.25}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:1px 10px;font-size:12px;margin-top:2px}
.kv span:nth-child(odd){color:var(--mut)} .kv span:nth-child(even){font-variant-numeric:tabular-nums;word-break:break-word}
table.tb{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:3px;font-variant-numeric:tabular-nums}
table.tb th{text-align:left;color:var(--mut);font-weight:500;border-bottom:1px solid var(--line);padding:2px 4px}
table.tb td{padding:2px 4px;border-bottom:1px solid var(--line)}
svg.ch{display:block;width:100%;margin-top:3px;overflow:visible}
svg.ch text{font-size:9px;fill:var(--mut);font-family:var(--mono)}
.lg{display:flex;flex-wrap:wrap;gap:8px;font-size:10.5px;color:var(--mut);margin-top:2px}
.lg i{display:inline-block;width:8px;height:3px;border-radius:2px;vertical-align:middle;margin-right:3px}
/* controls */
.ctl{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.ctl:empty{display:none}
.btn{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:6px;padding:3px 10px;cursor:pointer}
.btn:hover{border-color:var(--mut)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 45%,var(--line))}
.btn.danger:hover{background:var(--red);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.form{display:none;margin-top:6px;gap:6px;align-items:center;flex-wrap:wrap;background:var(--bg);padding:7px;border-radius:7px}
.form.on{display:flex}
.form label{font-size:12px;color:var(--mut)}
.form input,.form select{font:inherit;font-size:12px;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:5px;padding:3px 6px;min-width:0;flex:1}
.form input[type=checkbox]{flex:none}
details.lgx{margin-top:7px}
details.lgx summary{cursor:pointer;color:var(--mut);font-size:11.5px;user-select:none}
details.lgx pre{margin:5px 0 0;max-height:220px;overflow:auto;background:var(--bg);border-radius:6px;padding:6px 7px;font:11px/1.45 var(--mono);white-space:pre-wrap;word-break:break-all}
pre .warn{color:var(--amber)} pre .error{color:var(--red)} pre .cmd{color:var(--blue)} pre .sys{color:var(--mut)}
.meta{color:var(--mut);font-size:11px;margin-top:5px;display:flex;gap:10px;flex-wrap:wrap}
.meta a{color:var(--blue);text-decoration:none}
#snack{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:6px 12px;border-radius:7px;font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
#snack.on{opacity:1}
.dlg{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:20}
.dlg.on{display:flex}
.dlg .box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 14px 12px;max-width:86%;box-shadow:0 10px 30px #0006}
.dlg .t{margin-bottom:12px;word-break:break-word}
.dlg .row{display:flex;gap:6px;justify-content:flex-end}
.pywebview-drag-region{cursor:default}
.lng{font:inherit;font-size:12px;background:var(--track);color:var(--fg);border:0;border-radius:6px;padding:2px 4px;cursor:pointer;max-width:110px}
</style>
</head>
<body>
<header>
  <h1 class="pywebview-drag-region">TaskHub</h1><span class="cnt pywebview-drag-region" id="cnt"></span>
  <span class="sp pywebview-drag-region" style="align-self:stretch"></span>
  <div class="tabs"><button data-f="active" class="on" data-i="active"></button><button data-f="all" data-i="all"></button></div>
  <select id="lang" class="lng"></select>
  <button class="ib" id="mute" title="Сповіщення">🔔</button>
  <button class="ib" id="clear">🧹</button>
</header>
<div id="off" data-i="offline"></div>
<main id="list"></main>
<div id="snack"></div>
<div id="dlg" class="dlg"><div class="box"><div class="t"></div><div class="row"><button class="btn primary">OK</button><button class="btn">Скасувати</button></div></div></div>
<script>
"use strict";
const TOKEN = __TOKEN__;
const AUTOHIDE = __AUTOHIDE__;
const NATIVE = !!(window.chrome && window.chrome.webview);   // TaskHub .NET host (WebView2)
const host = m => { try{ window.chrome.webview.postMessage(m); }catch(e){} };
let modal = false;   // confirm() dialog open -> don't auto-hide
function ask(m){ return new Promise(res=>{ const d=document.getElementById("dlg"); d.querySelector(".t").textContent=m; d.classList.add("on"); modal=true;
  const [ok,no]=d.querySelectorAll("button");
  const k=e=>{ if(e.key==="Enter"){e.preventDefault();done(true);} else if(e.key==="Escape"){e.preventDefault();e.stopPropagation();done(false);} };
  const done=v=>{ d.classList.remove("on"); document.removeEventListener("keydown",k,true); setTimeout(()=>{modal=false;},50); res(v); };
  ok.onclick=()=>done(true); no.onclick=()=>done(false); document.addEventListener("keydown",k,true); ok.focus(); }); }
const H = {"Content-Type":"application/json","X-TaskHub":"1"};
if (TOKEN) H.Authorization = "Bearer " + TOKEN;
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ACTIVE = new Set(["running","paused","stale"]);
/* ---------------- i18n ---------------- */
const LANGS = {en:"English",uk:"Українська",es:"Español",de:"Deutsch",fr:"Français",it:"Italiano",pt:"Português",pl:"Polski",zh:"中文",ja:"日本語"};
const LOCALE = {en:"en-GB",uk:"uk-UA",es:"es-ES",de:"de-DE",fr:"fr-FR",it:"it-IT",pt:"pt-BR",pl:"pl-PL",zh:"zh-CN",ja:"ja-JP"};
const I18N = {
 en:{active:"Active",all:"All",notif_on:"Notifications on",notif_off:"Notifications off",clear_done:"Clear finished",offline:"No connection to TaskHub…",no_tasks:"No tasks",no_active:"No active tasks",ok:"OK",cancel:"Cancel",remove:"Remove",log:"Log",cmd_queued:"command queued",sent:"“{0}” sent",error:"Error",counts:"{0} active · {1} total",waiting:"waiting for data…",per_s:"u/s",eta:"ETA",silence:"silent",language:"Language",auto:"Auto",
  st_running:"running",st_paused:"paused",st_stale:"no response",st_done:"done",st_failed:"failed",st_cancelled:"cancelled",st_lost:"lost",u:["s","m","h","d"]},
 uk:{active:"Активні",all:"Усі",notif_on:"Сповіщення увімкнені",notif_off:"Сповіщення вимкнені",clear_done:"Прибрати завершені",offline:"Немає з'єднання з TaskHub…",no_tasks:"Немає задач",no_active:"Немає активних задач",ok:"OK",cancel:"Скасувати",remove:"Прибрати",log:"Лог",cmd_queued:"команда в черзі",sent:"«{0}» надіслано",error:"Помилка",counts:"{0} активн. · {1} всього",waiting:"очікування даних…",per_s:"од/с",eta:"ETA",silence:"тиша",language:"Мова",auto:"Авто",
  st_running:"працює",st_paused:"пауза",st_stale:"мовчить",st_done:"готово",st_failed:"помилка",st_cancelled:"скасовано",st_lost:"втрачено",u:["с","хв","г","д"]},
 es:{active:"Activas",all:"Todas",notif_on:"Notificaciones activadas",notif_off:"Notificaciones desactivadas",clear_done:"Quitar finalizadas",offline:"Sin conexión con TaskHub…",no_tasks:"No hay tareas",no_active:"No hay tareas activas",ok:"Aceptar",cancel:"Cancelar",remove:"Quitar",log:"Registro",cmd_queued:"comando en cola",sent:"«{0}» enviado",error:"Error",counts:"{0} activas · {1} en total",waiting:"esperando datos…",per_s:"u/s",eta:"ETA",silence:"sin señal",language:"Idioma",auto:"Automático",
  st_running:"en curso",st_paused:"en pausa",st_stale:"sin respuesta",st_done:"completada",st_failed:"fallida",st_cancelled:"cancelada",st_lost:"perdida",u:["s","min","h","d"]},
 de:{active:"Aktiv",all:"Alle",notif_on:"Benachrichtigungen an",notif_off:"Benachrichtigungen aus",clear_done:"Abgeschlossene entfernen",offline:"Keine Verbindung zu TaskHub…",no_tasks:"Keine Aufgaben",no_active:"Keine aktiven Aufgaben",ok:"OK",cancel:"Abbrechen",remove:"Entfernen",log:"Protokoll",cmd_queued:"Befehl in Warteschlange",sent:"„{0}“ gesendet",error:"Fehler",counts:"{0} aktiv · {1} gesamt",waiting:"warte auf Daten…",per_s:"E/s",eta:"ETA",silence:"still",language:"Sprache",auto:"Automatisch",
  st_running:"läuft",st_paused:"pausiert",st_stale:"keine Rückmeldung",st_done:"fertig",st_failed:"fehlgeschlagen",st_cancelled:"abgebrochen",st_lost:"verloren",u:["s","min","h","T"]},
 fr:{active:"Actives",all:"Toutes",notif_on:"Notifications activées",notif_off:"Notifications désactivées",clear_done:"Retirer les terminées",offline:"Pas de connexion à TaskHub…",no_tasks:"Aucune tâche",no_active:"Aucune tâche active",ok:"OK",cancel:"Annuler",remove:"Retirer",log:"Journal",cmd_queued:"commande en attente",sent:"« {0} » envoyé",error:"Erreur",counts:"{0} actives · {1} au total",waiting:"en attente de données…",per_s:"u/s",eta:"ETA",silence:"silence",language:"Langue",auto:"Auto",
  st_running:"en cours",st_paused:"en pause",st_stale:"sans réponse",st_done:"terminée",st_failed:"échouée",st_cancelled:"annulée",st_lost:"perdue",u:["s","min","h","j"]},
 it:{active:"Attive",all:"Tutte",notif_on:"Notifiche attive",notif_off:"Notifiche disattivate",clear_done:"Rimuovi completate",offline:"Nessuna connessione a TaskHub…",no_tasks:"Nessuna attività",no_active:"Nessuna attività attiva",ok:"OK",cancel:"Annulla",remove:"Rimuovi",log:"Log",cmd_queued:"comando in coda",sent:"«{0}» inviato",error:"Errore",counts:"{0} attive · {1} totali",waiting:"in attesa di dati…",per_s:"u/s",eta:"ETA",silence:"silenzio",language:"Lingua",auto:"Automatica",
  st_running:"in corso",st_paused:"in pausa",st_stale:"nessuna risposta",st_done:"completata",st_failed:"fallita",st_cancelled:"annullata",st_lost:"persa",u:["s","min","h","g"]},
 pt:{active:"Ativas",all:"Todas",notif_on:"Notificações ativadas",notif_off:"Notificações desativadas",clear_done:"Remover concluídas",offline:"Sem conexão com o TaskHub…",no_tasks:"Sem tarefas",no_active:"Sem tarefas ativas",ok:"OK",cancel:"Cancelar",remove:"Remover",log:"Log",cmd_queued:"comando na fila",sent:"“{0}” enviado",error:"Erro",counts:"{0} ativas · {1} no total",waiting:"aguardando dados…",per_s:"u/s",eta:"ETA",silence:"sem resposta",language:"Idioma",auto:"Automático",
  st_running:"em execução",st_paused:"pausada",st_stale:"sem resposta",st_done:"concluída",st_failed:"falhou",st_cancelled:"cancelada",st_lost:"perdida",u:["s","min","h","d"]},
 pl:{active:"Aktywne",all:"Wszystkie",notif_on:"Powiadomienia włączone",notif_off:"Powiadomienia wyłączone",clear_done:"Usuń zakończone",offline:"Brak połączenia z TaskHub…",no_tasks:"Brak zadań",no_active:"Brak aktywnych zadań",ok:"OK",cancel:"Anuluj",remove:"Usuń",log:"Log",cmd_queued:"polecenie w kolejce",sent:"„{0}” wysłano",error:"Błąd",counts:"{0} aktywne · {1} łącznie",waiting:"oczekiwanie na dane…",per_s:"j/s",eta:"ETA",silence:"cisza",language:"Język",auto:"Automatycznie",
  st_running:"działa",st_paused:"wstrzymane",st_stale:"brak odpowiedzi",st_done:"gotowe",st_failed:"błąd",st_cancelled:"anulowane",st_lost:"utracone",u:["s","min","h","d"]},
 zh:{active:"进行中",all:"全部",notif_on:"通知已开启",notif_off:"通知已关闭",clear_done:"清除已完成",offline:"无法连接 TaskHub…",no_tasks:"没有任务",no_active:"没有进行中的任务",ok:"确定",cancel:"取消",remove:"移除",log:"日志",cmd_queued:"命令排队中",sent:"已发送「{0}」",error:"错误",counts:"{0} 进行中 · 共 {1}",waiting:"等待数据…",per_s:"个/秒",eta:"剩余",silence:"无响应",language:"语言",auto:"自动",
  st_running:"运行中",st_paused:"已暂停",st_stale:"无响应",st_done:"已完成",st_failed:"失败",st_cancelled:"已取消",st_lost:"丢失",u:["秒","分","时","天"]},
 ja:{active:"実行中",all:"すべて",notif_on:"通知オン",notif_off:"通知オフ",clear_done:"完了を消去",offline:"TaskHub に接続できません…",no_tasks:"タスクなし",no_active:"実行中のタスクなし",ok:"OK",cancel:"キャンセル",remove:"削除",log:"ログ",cmd_queued:"コマンド待機中",sent:"「{0}」を送信しました",error:"エラー",counts:"{0} 実行中 · 全 {1}",waiting:"データ待ち…",per_s:"件/秒",eta:"残り",silence:"応答なし",language:"言語",auto:"自動",
  st_running:"実行中",st_paused:"一時停止",st_stale:"応答なし",st_done:"完了",st_failed:"失敗",st_cancelled:"キャンセル",st_lost:"消失",u:["秒","分","時間","日"]},
};
let LANG = (()=>{ const n=(navigator.language||"en").slice(0,2).toLowerCase(); return I18N[n]?n:"en"; })();
let LANG_SETTING = "auto";
function T(k, ...a){ const d=I18N[LANG]||I18N.en; let s=d[k]; if (s==null) s=I18N.en[k]; if (s==null) return k; return a.length? String(s).replace(/\{(\d)\}/g,(_,i)=>a[+i]) : s; }
const LOC = () => LOCALE[LANG]||"en-GB";
function applyLang(){
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-i]").forEach(e=>e.textContent=T(e.dataset.i));
  $("#clear").title = T("clear_done");
  const [ok,no]=document.querySelectorAll("#dlg button"); ok.textContent=T("ok"); no.textContent=T("cancel");
  const sel=$("#lang");
  sel.innerHTML = `<option value="auto">🌐 ${esc(T("auto"))}</option>` + Object.entries(LANGS).map(([k,v])=>`<option value="${k}">${esc(v)}</option>`).join("");
  sel.value = LANG_SETTING; sel.title = T("language");
  // rebuild cards so every translated string is refreshed
  $("#list").innerHTML=""; for (const k in ui) delete ui[k];
}

let ver = 0, data = null, filt = "active", skew = 0, focusSeq = null;
const ui = {};   // per-task UI state: {ctlSig, formFor}

function snack(t){ const s=$("#snack"); s.textContent=t; s.classList.add("on"); clearTimeout(snack.h); snack.h=setTimeout(()=>s.classList.remove("on"),2600); }
async function api(method, path, body){
  const r = await fetch(path, {method, headers:H, body: body===undefined?undefined:JSON.stringify(body)});
  const j = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}
function dur(s){ const u=T("u"); s=Math.max(0,Math.floor(s)); if(s<60) return s+u[0]; if(s<3600) return Math.floor(s/60)+u[1]+" "+String(s%60).padStart(2,"0")+u[0];
  if(s<86400) return Math.floor(s/3600)+u[2]+" "+String(Math.floor(s%3600/60)).padStart(2,"0")+u[1]; return Math.floor(s/86400)+u[3]+" "+Math.floor(s%86400/3600)+u[2]; }
function num(v, d){ if (typeof v!=="number"||!isFinite(v)) return esc(v ?? "—");
  if (d!=null) return v.toFixed(d); const a=Math.abs(v);
  if (a>=1e6) return (v/1e6).toFixed(2)+"M"; if (a>=1e4) return (v/1e3).toFixed(1)+"k";
  if (Number.isInteger(v)) return String(v); return v.toFixed(a>=100?1:a>=1?2:4).replace(/\.?0+$/,""); }
const now = () => Date.now()/1000 + skew;

/* ---------------- widgets ---------------- */
function lvl(w, v){ // threshold color
  if (typeof v!=="number") return "";
  const inv=!!w.invert;
  if (w.crit!=null && (inv? v<=w.crit : v>=w.crit)) return "var(--red)";
  if (w.warn!=null && (inv? v<=w.warn : v>=w.warn)) return "var(--amber)";
  return w.color || "";
}
function lab(w, right=""){ return w.label||right ? `<div class="lb"><span>${esc(w.label)}</span>${right?`<span class="lv">${right}</span>`:""}</div>` : ""; }
const W = {
  text(w){ return lab(w) + `<div class="v ${w.mono?"mono":""}">${esc(w.value ?? "—")}</div>`; },
  progress(w){
    let v=w.value, tot=w.total ?? w.max, f=null, txt="";
    if (typeof v==="number"){ if (tot){ f=v/tot; txt=`${num(v)} / ${num(tot)} ${esc(w.unit)}`; } else { f = v>1? v/100 : v; txt=(f*100).toFixed(1)+"%"; } }
    if (f!=null && tot) txt += ` · ${(f*100).toFixed(0)}%`;
    f = f==null?0:Math.max(0,Math.min(1,f));
    return lab(w, txt) + `<div class="pb" style="--wc:${lvl(w,f*100)||w.color||"var(--blue)"}"><i style="width:${(f*100).toFixed(2)}%"></i></div>`;
  },
  gauge(w){
    const v=w.value, mn=w.min??0, mx=w.max??100, f=typeof v==="number"?Math.max(0,Math.min(1,(v-mn)/(mx-mn||1))):0;
    const R=34, cx=44, cy=40, a0=Math.PI, a1=Math.PI*(1-f);
    const P=a=>[cx+R*Math.cos(a), cy-R*Math.sin(a)];
    const [x0,y0]=P(a0),[x1,y1]=P(a1),[xe,ye]=P(0);
    const col=lvl(w,v)||w.color||"var(--blue)";
    return `<div style="display:flex;align-items:center;gap:8px">
      <svg viewBox="0 0 88 46" width="88" height="46"><path d="M${x0},${y0} A${R},${R} 0 0 1 ${xe},${ye}" fill="none" stroke="var(--track)" stroke-width="8" stroke-linecap="round"/>
      ${f>0.002?`<path d="M${x0},${y0} A${R},${R} 0 0 1 ${x1.toFixed(2)},${y1.toFixed(2)}" fill="none" stroke="${col}" stroke-width="8" stroke-linecap="round"/>`:""}</svg>
      <div style="min-width:0">${lab(w)}<div class="big" style="color:${lvl(w,v)||"inherit"}">${num(v,w.decimals)}<small>${esc(w.unit)}</small></div></div></div>`;
  },
  stat(w){
    const v=w.value; let d="";
    if (typeof v==="number" && typeof w.prev==="number" && v!==w.prev){
      const up=v>w.prev, good=w.invert? !up : up;
      d=`<span class="dl ${good?"up":"dn"}">${up?"▲":"▼"} ${num(Math.abs(v-w.prev))}</span>`; }
    return lab(w) + `<div class="big" style="color:${lvl(w,v)||"inherit"}">${num(v,w.decimals)}<small>${esc(w.unit)}</small>${d}</div>`;
  },
  led(w){
    let v=w.value, txt=w.text, cls="off";
    if (v && typeof v==="object"){ txt=v.text??txt; v=v.state; }
    if (v===true) cls="ok"; else if (v===false) cls="error";
    else if (["ok","warn","error","busy","off"].includes(v)) cls=v;
    return `<div class="led"><i class="${cls}"></i><div style="min-width:0">${lab(w)}<div class="v">${esc(txt ?? (typeof v==="string"?v:""))}</div></div></div>`;
  },
  kv(w){
    const o=w.value||{}; return lab(w)+`<div class="kv">${Object.entries(o).map(([k,v])=>`<span>${esc(k)}</span><span>${typeof v==="number"?num(v,w.decimals):esc(v)}</span>`).join("")}</div>`;
  },
  table(w){
    const rows=(w.value||[]).slice(-50), cols=w.columns&&w.columns.length?w.columns:(rows[0]&&!Array.isArray(rows[0])?Object.keys(rows[0]):[]);
    const cell=v=>typeof v==="number"?num(v,w.decimals):esc(v);
    return lab(w)+`<table class="tb">${cols.length?`<tr>${cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr>`:""}
      ${rows.map(r=>`<tr>${(Array.isArray(r)?r:cols.map(c=>r[c])).map(v=>`<td>${cell(v)}</td>`).join("")}</tr>`).join("")}</table>`;
  },
  chart(w){
    const pts=w.points||[], S=w.series||[w.id], hgt=w.height||54, Wd=300;
    const last = pts.length? pts[pts.length-1] : null;
    const right = last ? S.map((s,i)=> last[i+1]==null?"":`${S.length>1?esc(s)+" ":""}${num(last[i+1],w.decimals)}`).filter(Boolean).join(" · ")+(w.unit?" "+esc(w.unit):"") : "";
    if (pts.length<2) return lab(w,right)+`<div class="v" style="color:var(--mut);font-size:11px;padding:8px 0">${T("waiting")}</div>`;
    let lo=Infinity, hi=-Infinity;
    for (const p of pts) for (let i=1;i<p.length;i++) if (p[i]!=null){ lo=Math.min(lo,p[i]); hi=Math.max(hi,p[i]); }
    if (w.y_min!=null) lo=w.y_min; if (w.y_max!=null) hi=w.y_max;
    if (w.kind==="bar" && w.y_min==null) lo=Math.min(0,lo);
    if (hi===lo){ hi+=1; lo-=1; }
    const t0=pts[0][0], t1=pts[pts.length-1][0]||t0+1, n=pts.length;
    const X = (p,k)=> w.kind==="bar" ? (k+0.5)/n*Wd : ((p[0]-t0)/((t1-t0)||1))*Wd;
    const Y = v => 4 + (1-(v-lo)/(hi-lo))*(hgt-8);
    let g = `<line x1="0" x2="${Wd}" y1="${Y(hi)}" y2="${Y(hi)}" stroke="var(--line)" stroke-dasharray="2 3"/><line x1="0" x2="${Wd}" y1="${Y(lo)}" y2="${Y(lo)}" stroke="var(--line)"/>`;
    if (w.warn!=null && w.warn>lo && w.warn<hi) g+=`<line x1="0" x2="${Wd}" y1="${Y(w.warn)}" y2="${Y(w.warn)}" stroke="var(--amber)" stroke-dasharray="3 3" opacity=".7"/>`;
    if (w.crit!=null && w.crit>lo && w.crit<hi) g+=`<line x1="0" x2="${Wd}" y1="${Y(w.crit)}" y2="${Y(w.crit)}" stroke="var(--red)" stroke-dasharray="3 3" opacity=".7"/>`;
    S.forEach((s,i)=>{
      const col=`var(--s${i%6+1})`;
      if (w.kind==="bar"){
        const bw=Math.max(1,Wd/n/S.length*0.8);
        pts.forEach((p,k)=>{ const v=p[i+1]; if(v==null) return; const x=(k+0.1)/n*Wd+i*bw, y0=Y(Math.max(lo,0)), y=Y(v);
          g+=`<rect x="${x.toFixed(1)}" y="${Math.min(y,y0).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0.5,Math.abs(y0-y)).toFixed(1)}" fill="${col}" opacity=".85"/>`; });
      } else {
        let d="", first=null, lastx=0;
        pts.forEach((p,k)=>{ const v=p[i+1]; if(v==null) return; const x=X(p,k).toFixed(1), y=Y(v).toFixed(1); d+=(d?"L":"M")+x+","+y; if(first==null) first=x; lastx=x; });
        if (w.kind==="area" && d) g+=`<path d="${d}L${lastx},${hgt-4}L${first},${hgt-4}Z" fill="${col}" opacity=".15"/>`;
        g+=`<path d="${d}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`;
      }
    });
    g += `<text x="${Wd-2}" y="${Y(hi)+9}" text-anchor="end">${num(hi)}</text><text x="${Wd-2}" y="${Y(lo)-2}" text-anchor="end">${num(lo)}</text>`;
    const legend = S.length>1 ? `<div class="lg">${S.map((s,i)=>`<span><i style="background:var(--s${i%6+1})"></i>${esc(s)}</span>`).join("")}</div>` : "";
    return lab(w,right)+`<svg class="ch" viewBox="0 0 ${Wd} ${hgt}" preserveAspectRatio="none" style="height:${hgt}px">${g}</svg>`+legend;
  },
};
function renderWidgets(t){
  const ws=t.widgets||[]; let html="";
  for (const w of ws){
    const f=W[w.type]||W.text, wide = w.span===2 || (["chart","table","kv","progress"].includes(w.type) && w.span!==1);
    let inner; try{ inner=f(w); }catch(e){ inner=`<div class="v">widget error: ${esc(e.message)}</div>`; }
    html += `<div class="w ${wide?"span2":""}">${inner}</div>`;
  }
  const m=t.metrics||{}, mk=Object.keys(m);
  if (mk.length) html += `<div class="w span2"><div class="kv">${mk.map(k=>`<span>${esc(k)}</span><span>${typeof m[k]==="number"?num(m[k]):esc(m[k])}</span>`).join("")}</div></div>`;
  return html;
}

/* ---------------- cards ---------------- */
function cardSkeleton(t){
  const el=document.createElement("div");
  el.className="card"; el.id="t-"+t.id;
  el.innerHTML=`<div class="hd"><span class="name"></span><span class="chip src"></span><span class="st"></span><span class="sp"></span><span class="tm"></span><button class="x" title="${T("remove")}">×</button></div>
   <div class="desc"></div><div class="bar"><i></i></div><div class="l1"></div><div class="status"></div><div class="stage"></div>
   <div class="wg"></div><div class="msg"></div><div class="ctl"></div><div class="form"></div>
   <details class="lgx"><summary></summary><pre></pre></details><div class="meta"></div>`;
  $(".x",el).onclick=()=>api("DELETE",`/api/tasks/${t.id}`).catch(e=>snack(e.message));
  $("details",el).addEventListener("toggle",()=>{ if($("details",el).open) fillLog(el, findTask(t.id), true); });
  ui[t.id]={};
  return el;
}
const findTask = id => data && data.tasks.find(x=>x.id===id);
function fillLog(el, t, scroll){
  const pre=$("pre",el), atBottom = pre.scrollTop+pre.clientHeight >= pre.scrollHeight-8;
  pre.innerHTML=(t.log||[]).slice(-300).map(l=>`<span class="${esc(l.level)}">${new Date(l.t*1000).toLocaleTimeString(LOC())}  ${esc(l.msg)}</span>`).join("\n");
  if (scroll||atBottom) pre.scrollTop=pre.scrollHeight;
}
function times(t){
  const end = t.finished || now(), el = end - t.started;
  let s = dur(el);
  if (ACTIVE.has(t.state) && t.progress>0.005 && t.progress<1) s += " · "+T("eta")+" " + dur(el/t.progress*(1-t.progress));
  if (t.state==="stale") s += " · "+T("silence")+" " + dur(now()-t.last_seen);
  return s;
}
function updCard(el, t){
  el.dataset.s=t.state; if (ACTIVE.has(t.state)) el.dataset.active=1; else delete el.dataset.active;
  $(".name",el).textContent=t.name; $(".name",el).title=t.name+" ["+t.id+"]";
  const src=$(".src",el); src.textContent=t.source; src.style.display=t.source?"":"none";
  $(".st",el).textContent=T("st_"+t.state);
  $(".tm",el).textContent=times(t);
  const d=$(".desc",el); d.textContent=t.description||""; d.style.display=t.description?"":"none";
  const bar=$(".bar",el), hasP = t.progress!=null;
  bar.style.display = (hasP || ACTIVE.has(t.state)) ? "" : "none";
  bar.classList.toggle("ind", !hasP && t.state==="running");
  $("i",bar).style.width = hasP ? (t.progress*100).toFixed(2)+"%" : "0";
  let l1=[];
  if (hasP) l1.push(`<b>${(t.progress*100).toFixed(1)}%</b>`);
  if (t.current!=null) l1.push(`${num(t.current)}${t.total!=null?" / "+num(t.total):""} ${esc(t.unit)}`);
  if (hasP && ACTIVE.has(t.state) && t.current!=null && t.progress>0){ const r=t.current/Math.max(1,now()-t.started); l1.push(`${num(r)} ${t.unit?esc(t.unit)+"/s":T("per_s")}`); }
  $(".l1",el).innerHTML=l1.join("<span>·</span>"); $(".l1",el).style.display=l1.length?"":"none";
  $(".status",el).textContent=t.status||""; $(".status",el).style.display=t.status?"":"none";
  $(".stage",el).textContent=t.stage?("▸ "+t.stage):""; $(".stage",el).style.display=t.stage?"":"none";
  const wg=$(".wg",el), wh=renderWidgets(t); if (wg.__h!==wh){ wg.innerHTML=wh; wg.__h=wh; } wg.style.display=wh?"":"none";
  const m=$(".msg",el); m.textContent=t.message||""; m.style.display=(t.message&&!ACTIVE.has(t.state))?"":"none";
  // controls (rebuild only if changed and no open form)
  const avail=(t.controls||[]).filter(c=>c.states.includes(t.state));
  const sig=JSON.stringify(avail)+t.state;
  if (ui[t.id].ctlSig!==sig && !ui[t.id].formFor){
    ui[t.id].ctlSig=sig;
    const box=$(".ctl",el); box.innerHTML="";
    for (const c of avail){
      const b=document.createElement("button");
      b.className="btn "+(c.style||""); b.textContent=c.label + (c.input?" …":""); if (c.hint) b.title=c.hint;
      b.onclick=()=>onControl(el,t.id,c,b);
      box.appendChild(b);
    }
  }
  // log
  $("summary",el).textContent=`${T("log")} (${(t.log||[]).length})` + (t.commands&&t.commands.some(c=>c.status==="pending")?" · "+T("cmd_queued"):"");
  if ($("details",el).open) fillLog(el,t);
  // meta / links
  const links=(t.links||[]).map(l=>typeof l==="string"?{label:l,url:l}:l).filter(l=>l&&l.url);
  const meta=[];
  if (t.pid) meta.push("pid "+t.pid);
  if (t.cwd) meta.push(esc(t.cwd));
  links.forEach((l,i)=>meta.push(`<a href="#" data-i="${i}">${esc(l.label||l.url)}</a>`));
  const mt=$(".meta",el), mh=meta.join("<span>·</span>");
  if (mt.__h!==mh){ mt.innerHTML=mh; mt.__h=mh; mt.querySelectorAll("a").forEach(a=>a.onclick=e=>{e.preventDefault(); const u=links[+a.dataset.i].url; if (NATIVE) host({open:u}); else window.open(u,"_blank");}); }
}
async function onControl(el, tid, c, btn){
  if (!c.input){
    if (c.confirm && !(await ask(c.confirm))) return;
    return send(tid,c,undefined,btn);
  }
  const f=$(".form",el), i=c.input; ui[tid].formFor=c.id;
  const dv = c.last_value ?? i.default;   // last sent value, else the declared default
  let field;
  if (i.type==="select") field=`<select>${i.options.map(o=>`<option ${o==dv?"selected":""}>${esc(o)}</option>`).join("")}</select>`;
  else if (i.type==="bool") field=`<input type="checkbox" ${dv?"checked":""}>`;
  else if (i.type==="number") field=`<input type="number" value="${esc(dv??"")}" ${i.min!=null?`min="${i.min}"`:""} ${i.max!=null?`max="${i.max}"`:""} step="${i.step??"any"}">`;
  else field=`<input type="text" value="${esc(dv??"")}" placeholder="${esc(i.placeholder??"")}">`;
  f.innerHTML=`<label>${esc(i.label||c.label)}</label>${field}<button class="btn primary">OK</button><button class="btn">✕</button>`;
  f.classList.add("on");
  const inp=f.querySelector("input,select"); inp.focus(); if (inp.select) try{inp.select();}catch(e){}
  const close=()=>{ f.classList.remove("on"); f.innerHTML=""; ui[tid].formFor=null; ui[tid].ctlSig=null; const t=findTask(tid); if(t) updCard(el,t); };
  const ok=async ()=>{
    let v = i.type==="bool"? inp.checked : i.type==="number"? (inp.value===""?null:Number(inp.value)) : inp.value;
    if (c.confirm && !(await ask(c.confirm))) return;
    close(); send(tid,c,v);
  };
  const [bok,bx]=f.querySelectorAll("button"); bok.onclick=ok; bx.onclick=close;
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter") ok(); if(e.key==="Escape"){ e.stopPropagation(); close(); } });
}
async function send(tid,c,value,btn){
  if (btn) btn.disabled=true;
  try{ await api("POST",`/api/tasks/${tid}/controls/${c.id}`, value===undefined?{}:{value}); snack(T("sent",c.label)); }
  catch(e){ snack(T("error")+": "+e.message); }
  finally{ if (btn) btn.disabled=false; }
}

function render(){
  if (!data) return;
  if ((data.lang && data.lang!==LANG) || (data.language && data.language!==LANG_SETTING)){ LANG=data.lang||LANG; LANG_SETTING=data.language||"auto"; applyLang(); }
  const list=$("#list"), tasks=data.tasks.filter(t=> filt==="all" || ACTIVE.has(t.state));
  const nAct=data.tasks.filter(t=>ACTIVE.has(t.state)).length;
  $("#cnt").textContent = T("counts",nAct,data.tasks.length);
  $("#mute").textContent = data.muted ? "🔕" : "🔔";
  $("#mute").title = data.muted ? T("notif_off") : T("notif_on");
  const keep=new Set(tasks.map(t=>"t-"+t.id));
  [...list.children].forEach(c=>{ if(!keep.has(c.id)) c.remove(); });
  let prev=null;
  for (const t of tasks){
    let el=document.getElementById("t-"+t.id);
    if (!el) el=cardSkeleton(t);
    updCard(el,t);
    const want = prev ? prev.nextSibling : list.firstChild;
    if (want!==el) list.insertBefore(el, want);
    prev=el;
  }
  if (!tasks.length){ list.innerHTML=`<div class="empty">${filt==="all"?T("no_tasks"):T("no_active")}</div>`; }
  // focus request (tray/toast click)
  const fc=data.focus||{};
  if (focusSeq===null) focusSeq = fc.seq;
  else if (fc.seq!==focusSeq){ focusSeq=fc.seq; if (fc.task) flash(fc.task); }
}
function flash(id){
  const t=findTask(id); if (t && !ACTIVE.has(t.state) && filt!=="all"){ setFilt("all"); }
  const el=document.getElementById("t-"+id); if (!el) return;
  el.scrollIntoView({block:"center",behavior:"smooth"}); el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
}
function setFilt(f){ filt=f; document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.f===f)); try{localStorage.th_f=f;}catch(e){} render(); }

async function loop(){
  let fails=0;
  for(;;){
    try{
      const r=await fetch(`/api/tasks?since=${ver}&wait=25`, {headers:TOKEN?{Authorization:H.Authorization}:{}});
      if (!r.ok) throw new Error(r.status);
      const j=await r.json(); skew=j.now-Date.now()/1000; ver=j.version; data=j;
      $("#off").style.display="none"; fails=0; render();
    }catch(e){ $("#off").textContent=T("offline")+" ("+(e&&e.message||e)+")"; $("#off").style.display="block"; await new Promise(r=>setTimeout(r, Math.min(5000, 800*++fails))); }
  }
}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>setFilt(b.dataset.f));
$("#mute").onclick=()=>api("POST","/api/settings",{muted:!(data&&data.muted)}).catch(e=>snack(e.message));
$("#clear").onclick=()=>api("POST","/api/clear",{}).catch(e=>snack(e.message));
const seen=()=>api("POST","/api/settings",{seen:true}).catch(()=>{});
window.addEventListener("focus",seen);
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && !modal && !Object.values(ui).some(u=>u.formFor)){ if (NATIVE) host("hide"); else api("POST","/api/ui/hide",{}).catch(()=>{}); } });
// drag the frameless window by the header (anything in it that is not a control)
document.addEventListener("mousedown",e=>{ if(!NATIVE || e.button!==0) return; const h=e.target.closest("header"); if(!h || e.target.closest("button,.tabs,input,select,a")) return; e.preventDefault(); host("drag"); });
window.addEventListener("blur",()=>{
  if (!AUTOHIDE || NATIVE) return;   // the native host hides itself on deactivation
  setTimeout(async ()=>{
    if (document.hasFocus() || modal || Object.values(ui).some(u=>u.formFor)) return;
    try{ const r=await api("POST","/api/ui/hide",{}); if (!r.hidden) window.close(); }catch(e){ window.close(); }
  }, 250);
});
setInterval(()=>{ if(!data) return; for(const t of data.tasks){ const el=document.getElementById("t-"+t.id); if(el) $(".tm",el).textContent=times(t);} },1000);
try{ if(localStorage.th_f) filt=localStorage.th_f; }catch(e){}
applyLang();
$("#lang").onchange=e=>api("POST","/api/settings",{language:e.target.value}).catch(err=>snack(err.message));
setFilt(filt); seen(); loop();
if (location.hash.length>1) setTimeout(()=>flash(location.hash.slice(1)),600);
</script>
</body>
