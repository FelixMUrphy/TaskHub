<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TaskHub</title>
<link rel="icon" href="/icon.png">
<style>
:root{
  --bg:#f3f3f3;--card:#fbfbfb;--fg:#1a1a1a;--mut:#616161;--line:#e5e5e5;--track:#e6e6e6;
  --blue:#2f6fed;--green:#16a34a;--red:#dc2626;--amber:#d97706;--grey:#8a8a8a;--violet:#7c3aed;
  --s1:#2f6fed;--s2:#e8590c;--s3:#16a34a;--s4:#9333ea;--s5:#0891b2;--s6:#ca8a04;
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
  /* accent (Windows accent colour from the host, or TaskHub blue) and the text colour on it */
  --acc:var(--blue);--accfg:#fff;
  /* "busy / working" indicators: the accent, or TaskHub blue when the accent is grey */
  --live:var(--acc);
  /* background opacity: 100% unless the host has a Windows 11 backdrop behind the page (panel_transparency) */
  --alpha:100%;--calpha:100%;--halo:0%;--hhalo:0%;
  color-scheme:light;
}
/* Fluent-style layers: plates, controls and hairlines inside a card have no colour of their own - they lighten (dark
   theme) or darken (light theme) whatever is under them by a few percent, so they are exactly as see-through as the card */
:root,:root[data-theme]{
  --o1:color-mix(in srgb,var(--fg) 6%,transparent);
  --o2:color-mix(in srgb,var(--fg) 10%,transparent);
  --o3:color-mix(in srgb,var(--fg) 15%,transparent);
  --ln:color-mix(in srgb,var(--fg) 12%,transparent);
}
html.acc-neutral{--live:var(--blue)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#202020;--card:#2b2b2b;--fg:#f3f3f3;--mut:#9e9e9e;--line:#3a3a3a;--track:#3d3d3d;
  --blue:#5b8ff9;--green:#3ccf74;--red:#f87171;--amber:#fbbf24;--grey:#808080;
  --s1:#5b8ff9;--s2:#ff8a4c;--s3:#3ccf74;--s4:#b57bff;--s5:#34c3e0;--s6:#f2c94c;color-scheme:dark;}}
:root[data-theme=dark]{
  --bg:#202020;--card:#2b2b2b;--fg:#f3f3f3;--mut:#9e9e9e;--line:#3a3a3a;--track:#3d3d3d;
  --blue:#5b8ff9;--green:#3ccf74;--red:#f87171;--amber:#fbbf24;--grey:#808080;
  --s1:#5b8ff9;--s2:#ff8a4c;--s3:#3ccf74;--s4:#b57bff;--s5:#34c3e0;--s6:#f2c94c;color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;height:100%;color:var(--fg);font:13px/1.4 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif}
body{background:color-mix(in srgb,var(--bg) var(--alpha),transparent);display:flex;flex-direction:column;overflow:hidden}
/* docked panel: no hard line on the left edge - the tint fades in over the first pixels; an invisible grip there resizes it */
html.native body{background:linear-gradient(to right,transparent,color-mix(in srgb,var(--bg) var(--alpha),transparent) 14px)}
/* see-through settings: a soft halo in the background colour keeps text readable over any window */
html.halo #list{text-shadow:0 0 3px color-mix(in srgb,var(--bg) var(--halo),transparent),0 0 1px color-mix(in srgb,var(--bg) var(--halo),transparent)}
html.halo header{text-shadow:0 0 3px color-mix(in srgb,var(--bg) var(--hhalo),transparent),0 0 1px color-mix(in srgb,var(--bg) var(--hhalo),transparent)}
#grip{display:none;position:fixed;left:0;top:0;bottom:0;width:6px;cursor:ew-resize;z-index:31}
html.native #grip{display:block}
header{user-select:none;flex:none;position:relative;z-index:5;display:flex;align-items:center;gap:8px;padding:10px 12px 8px;border-bottom:1px solid var(--ln)}
header h1{font-size:14px;margin:0;font-weight:650;letter-spacing:.2px}
header .cnt{color:var(--mut);font-size:12px}
header .sp{flex:1}
.tabs{display:flex;gap:2px;background:var(--o1);border-radius:7px;padding:2px}
.tabs button{border:0;background:none;color:var(--mut);padding:3px 9px;border-radius:5px;font:inherit;font-size:12px;cursor:pointer}
.tabs button.on{background:var(--o3);color:var(--fg)}
.tabs button:not(.on):hover{background:var(--o1);color:var(--fg)}
.ib{border:0;background:none;color:var(--fg);cursor:pointer;width:32px;height:30px;padding:0;border-radius:5px;flex:none;
  display:inline-flex;align-items:center;justify-content:center}
.ib:hover{background:var(--o2)} .ib:active{background:var(--o1)}
/* header icons: the Windows 11 system icon font (Segoe Fluent Icons; Segoe MDL2 Assets on Windows 10) - one colour, one size;
   states by shape (bell / crossed bell, outline / filled pin), the support heart only slightly warmer than the rest */
.ib i{font:normal 16px/1 "Segoe Fluent Icons","Segoe MDL2 Assets";speak:none}
#sup i{color:color-mix(in srgb,#e0526b 55%,var(--fg))}
#off{display:none;background:var(--red);color:#fff;font-size:12px;padding:4px 12px}
main{padding:10px;display:flex;flex-direction:column;gap:9px}
#off{flex:none}
/* the list scrolls (wheel, touchpad, keys) with no native scrollbar: a thin overlay thumb (#sb) shows while scrolling or
   near the right edge and fades out; the edges fade when there is more content above / below */
#list{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;outline:none;scrollbar-width:none;
  --ft:0px;--fb:0px;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 var(--ft),#000 calc(100% - var(--fb)),transparent 100%);
  mask-image:linear-gradient(to bottom,transparent 0,#000 var(--ft),#000 calc(100% - var(--fb)),transparent 100%)}
#list::-webkit-scrollbar{display:none}
#list.ft{--ft:18px} #list.fb{--fb:30px}
#list>*{flex-shrink:0}
#sb{position:fixed;right:0;width:14px;z-index:6;opacity:0;transition:opacity .35s ease;pointer-events:none}
#sb.on{opacity:1;pointer-events:auto;transition-duration:.1s}
#sb i{position:absolute;right:3px;top:0;width:4px;border-radius:3px;background:color-mix(in srgb,var(--fg) 45%,transparent);transition:width .12s,right .12s,background .12s}
#sb:hover i,#sb.drag i{width:6px;right:2px;background:color-mix(in srgb,var(--fg) 62%,transparent)}
#sb.none{display:none}
.empty{color:var(--mut);text-align:center;padding:50px 10px}
/* many tasks: structure only when needed - quiet text and shades, no lines or frames */
#srcf{display:none;gap:2px;padding:0 10px 6px;font-size:12px;color:var(--mut);flex:none;flex-wrap:wrap;user-select:none}
#srcf.on{display:flex}
#srcf span{padding:1px 8px;border-radius:9px;cursor:pointer} #srcf span.on{background:var(--o2);color:var(--fg)}
.sec{display:flex;align-items:baseline;gap:6px;font-size:11.5px;color:var(--mut);margin:2px 4px -2px;user-select:none}
.sec b{color:var(--fg);font-weight:600;font-size:12px} .sec .dot{width:7px;height:7px;border-radius:50%;background:var(--amber);align-self:center}
.grp{display:flex;align-items:baseline;gap:7px;font-size:12px;color:var(--mut);padding:5px 6px 0;cursor:pointer;user-select:none;border-radius:8px;min-width:0}
.grp .chev{width:10px;font-size:10px;flex:none} .grp b{color:var(--fg);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.grp .sum{margin-left:auto;font-size:11.5px;white-space:nowrap;padding-left:8px}
.grp.closed{padding:6px}
.row{display:flex;align-items:center;gap:8px;padding:4px 8px 4px 10px;margin:-4px 0;border-radius:8px;font-size:12.5px;min-width:0;cursor:pointer}
/* faint chevron: the row opens into the full card (rotated on an open card, which folds back) */
.fold{color:var(--mut);opacity:.55;font-size:13px;line-height:1;flex:none;width:10px;text-align:center;transition:transform .2s ease;user-select:none}
.card .fold{display:none;margin-left:2px} .card:not([data-active]) .fold{display:inline-block;transform:rotate(90deg)}
.row>i{width:7px;height:7px;border-radius:50%;flex:none;background:var(--sc,var(--grey))}
.row .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.row .r{color:var(--mut);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1 1 0}
.row .t{color:var(--mut);font-size:11px;white-space:nowrap;padding-left:6px;flex:none}
.row.new .n{font-weight:650} .row.new .r{color:var(--fg);opacity:.8}
.badge{display:inline-block;min-width:16px;padding:0 5px;margin-left:5px;border-radius:8px;font-size:10.5px;line-height:16px;text-align:center;font-weight:650;background:var(--o3);color:var(--fg)}
.badge.bad{background:var(--red);color:#fff}
.row[data-s=done]{--sc:var(--green)} .row[data-s=failed],.row[data-s=lost]{--sc:var(--red)} .row[data-s=cancelled]{--sc:var(--grey)}
.hist{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--mut);padding:6px 10px;border-radius:8px;cursor:pointer;user-select:none}
.hist.open .fold{transform:rotate(90deg)}
.empty .lnk{display:inline-block;margin-top:8px;font-size:12px;cursor:pointer;color:var(--fg);opacity:.8}
.card:not([data-active]) .hd{cursor:pointer}
.card[data-attn][data-s]{--sc:var(--amber)}
.attn{color:var(--amber);font-size:12px;margin-top:3px;word-break:break-word}
.chip.prj{color:var(--fg);opacity:.75}
.card{border-radius:10px;padding:10px 11px 9px 14px;position:relative;isolation:isolate}
/* the card's own layer: blurred, so its edges are soft rather than a frame */
.card::after{content:"";position:absolute;inset:1px;z-index:-1;border-radius:12px;background:color-mix(in srgb,var(--card) var(--calpha),transparent);filter:blur(4px);pointer-events:none}
.card::before{content:"";position:absolute;left:3px;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--sc,var(--grey))}
.card.flash{animation:fl 1.4s}
@keyframes fl{0%,40%{box-shadow:0 0 0 3px var(--acc)}100%{box-shadow:none}}
.card[data-s=running]{--sc:var(--acc)} .card[data-s=paused]{--sc:var(--violet)}
.card[data-s=stale]{--sc:var(--amber)} .card[data-s=done]{--sc:var(--green)}
.card[data-s=failed],.card[data-s=lost]{--sc:var(--red)} .card[data-s=cancelled]{--sc:var(--grey)}
.hd{display:flex;align-items:center;gap:6px}
.name{font-weight:620;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.chip{font-size:10.5px;color:var(--mut);border:1px solid var(--ln);border-radius:9px;padding:0 6px;white-space:nowrap}
.st{font-size:10.5px;font-weight:650;text-transform:uppercase;letter-spacing:.4px;color:var(--sc)}
.hd .sp{flex:1}
.tm{color:var(--mut);font-size:11.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.x{border:0;background:none;color:var(--mut);cursor:pointer;font-size:15px;line-height:1;padding:0 2px;visibility:hidden}
.card:not([data-active]) .x{visibility:visible}
.desc{color:var(--mut);font-size:12px;margin-top:2px}
.bar{height:6px;background:var(--o2);border-radius:4px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--sc);border-radius:4px;transition:width .4s}
.bar.ind i{width:30%!important;animation:ind 1.3s infinite ease-in-out}
@keyframes ind{0%{transform:translateX(-100%)}100%{transform:translateX(340%)}}
.l1{display:flex;gap:10px;color:var(--mut);font-size:11.5px;font-variant-numeric:tabular-nums}
.l1 b{color:var(--fg);font-weight:600}
.status{margin-top:4px;word-break:break-word}
.stage{color:var(--mut);font-size:12px}
.msg{margin-top:6px;font-size:12px;padding:5px 8px;border-radius:6px;background:var(--o1);word-break:break-word}
.card[data-s=failed] .msg,.card[data-s=lost] .msg{color:var(--red)}
/* widgets */
.wg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.w{background:var(--o1);border-radius:7px;padding:6px 8px;min-width:0}
.w.span2{grid-column:span 2}
.w .lb{font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:6px}
.w .lb .lv{margin-left:auto;text-transform:none;letter-spacing:0;color:var(--fg);font-variant-numeric:tabular-nums}
.w .v{font-size:13px;word-break:break-word}
.w .v.mono{font-family:var(--mono);font-size:12px;white-space:pre-wrap}
.w .big{font-size:20px;font-weight:620;font-variant-numeric:tabular-nums;line-height:1.2}
.w .big small{font-size:12px;color:var(--mut);font-weight:400;margin-left:3px}
.dl{font-size:11px;margin-left:6px} .dl.up{color:var(--green)} .dl.dn{color:var(--red)}
.w .pb{height:7px;background:var(--o2);border-radius:4px;overflow:hidden;margin-top:4px}
.w .pb i{display:block;height:100%;border-radius:4px;background:var(--wc,var(--acc));transition:width .4s}
.led{display:flex;align-items:center;gap:7px}
.led i{width:10px;height:10px;border-radius:50%;background:transparent;box-shadow:inset 0 0 0 1.5px var(--grey);flex:none}
.led i.ok{background:var(--green);box-shadow:0 0 6px var(--green)} .led i.warn{background:var(--amber);box-shadow:0 0 6px var(--amber)}
.led i.error{background:var(--red);box-shadow:0 0 6px var(--red)} .led i.busy{background:var(--live);box-shadow:0 0 0 0 var(--live);animation:pulse 1.6s infinite ease-out}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--live) 70%,transparent)}100%{box-shadow:0 0 0 7px transparent}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:1px 10px;font-size:12px;margin-top:2px}
.kv span:nth-child(odd){color:var(--mut)} .kv span:nth-child(even){font-variant-numeric:tabular-nums;word-break:break-word}
table.tb{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:3px;font-variant-numeric:tabular-nums}
table.tb th{text-align:left;color:var(--mut);font-weight:500;border-bottom:1px solid var(--ln);padding:2px 4px}
table.tb td{padding:2px 4px;border-bottom:1px solid var(--ln)}
svg.ch{display:block;width:100%;margin-top:3px;overflow:visible}
.chw{display:flex;gap:6px;margin-top:3px}
.chw svg.ch{flex:1;width:0;min-width:0;margin-top:0}
.chw .ax{flex:none;display:flex;flex-direction:column;justify-content:space-between;font:9.5px/1 var(--mono);color:var(--mut);text-align:right;font-variant-numeric:tabular-nums}
.wait{color:var(--mut);font-size:11px;padding:8px 0}
.lg{display:flex;flex-wrap:wrap;gap:8px;font-size:10.5px;color:var(--mut);margin-top:2px}
.lg i{display:inline-block;width:8px;height:3px;border-radius:2px;vertical-align:middle;margin-right:3px}
/* controls */
.ctl{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.ctl:empty{display:none}
.btn{font:inherit;font-size:12px;border:1px solid var(--ln);background:var(--o1);color:var(--fg);border-radius:6px;padding:3px 10px;cursor:pointer}
.btn:hover,.btn:focus-visible{background:var(--o2)}
.btn:active{background:var(--o3)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--accfg);font-weight:600}
.btn.primary:hover{background:color-mix(in srgb,var(--acc) 88%,var(--fg))}
html.acc-neutral .btn.primary{background:var(--fg);border-color:var(--fg);color:var(--bg)}
html.acc-neutral .btn.primary:hover{background:color-mix(in srgb,var(--fg) 85%,var(--bg))}
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 45%,transparent)}
.btn.danger:hover{background:var(--red);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.form{display:none;margin-top:6px;gap:6px;align-items:center;flex-wrap:wrap;background:var(--o1);padding:7px;border-radius:7px}
.form.on{display:flex}
.form label{font-size:12px;color:var(--mut)}
.form input,.form select{font:inherit;font-size:12px;background:var(--o1);color:var(--fg);border:1px solid var(--ln);border-radius:5px;padding:3px 6px;min-width:0;flex:1}
.form input:hover,.form select:hover{background:var(--o2)}
.form input:focus,.form select:focus{background:var(--o2);border-color:var(--acc);outline:none}
.form select option{background:var(--card);color:var(--fg)}
.form input[type=checkbox]{flex:none}
details.lgx{margin-top:7px}
details.lgx summary{cursor:pointer;color:var(--mut);font-size:11.5px;user-select:none}
details.lgx pre{margin:5px 0 0;max-height:220px;overflow:auto;background:var(--o1);border-radius:6px;padding:6px 7px;font:11px/1.45 var(--mono);white-space:pre-wrap;word-break:break-all}
pre .warn{color:var(--amber)} pre .error{color:var(--red)} pre .cmd{color:var(--blue)} pre .sys{color:var(--mut)}
.meta{color:var(--mut);font-size:11px;margin-top:5px;display:flex;gap:10px;flex-wrap:wrap}
.meta a{color:var(--acc);text-decoration:none}
#snack{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:6px 12px;border-radius:7px;font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
#snack.on{opacity:1}
.dlg{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:20}
.dlg.on{display:flex}
.dlg .box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 14px 12px;max-width:86%;box-shadow:0 10px 30px #0006}
.dlg .t{margin-bottom:12px;word-break:break-word}
.dlg .row{display:flex;gap:6px;justify-content:flex-end}
.pywebview-drag-region{cursor:default}
.lng{font:inherit;font-size:12px;background:var(--track);color:var(--fg);border:0;border-radius:6px;padding:2px 4px;cursor:pointer;max-width:110px}
/* settings page: replaces the header and the list while open (Windows 11 settings: sections of rounded cards, rows with
   a title, a grey description and the control on the right, toggle switches) */
body.setmode>header,body.setmode #srcf,body.setmode #list,body.setmode #sb{display:none}
#set{display:none;flex:1;min-height:0;flex-direction:column}
body.setmode #set{display:flex}
#set .sh{flex:none;display:flex;align-items:center;gap:6px;padding:8px 12px 8px 8px;border-bottom:1px solid var(--ln);user-select:none}
#set .sh h2{font-size:14px;font-weight:650;margin:0}
#set .sc{flex:1;min-height:0;overflow-y:auto;outline:none;padding:4px 10px 16px;scrollbar-width:thin;overscroll-behavior:contain}
#set h3{font-size:12.5px;font-weight:600;margin:14px 2px 6px}
#set .scard{background:color-mix(in srgb,var(--card) var(--calpha),transparent);border:1px solid var(--ln);border-radius:8px}
#set .srow{display:flex;align-items:center;gap:10px;padding:8px 12px;min-height:44px}
#set .srow+.srow{border-top:1px solid var(--ln)}
#set .sl{flex:1;min-width:0;overflow-wrap:anywhere}
#set .sd{color:var(--mut);font-size:11.5px;margin-top:1px}
#set .srow.sub .sl{padding-left:14px}
#set select{font:inherit;font-size:12px;background:var(--o1);color:var(--fg);border:1px solid var(--ln);border-radius:5px;padding:3px 4px;min-width:0;max-width:52%}
#set select:hover{background:var(--o2)}
#set select option{background:var(--card);color:var(--fg)}
#set .rg{display:flex;align-items:center;gap:6px;min-width:0;width:48%}
#set input[type=range]{flex:1;min-width:0;accent-color:var(--acc)}
#set .rv{font-variant-numeric:tabular-nums;color:var(--mut);font-size:12px;min-width:34px;text-align:right}
#set .rg.off{opacity:.45}
#set .btn{flex:none;padding:4px 12px}
#set .btn.heart::before{content:"\EB51";font:normal 13px/1 "Segoe Fluent Icons","Segoe MDL2 Assets";margin-right:6px;vertical-align:-2px;color:color-mix(in srgb,#e0526b 55%,var(--fg))}
/* Windows 11 toggle switch: outlined pill with a dot when off, filled with the accent when on */
.tgl{flex:none;width:40px;height:20px;border-radius:10px;border:1px solid color-mix(in srgb,var(--fg) 55%,transparent);background:var(--o1);
  position:relative;cursor:pointer;padding:0;transition:background .12s,border-color .12s}
.tgl i{position:absolute;left:4px;top:4px;width:10px;height:10px;border-radius:50%;background:color-mix(in srgb,var(--fg) 80%,transparent);transition:left .12s,width .12s}
.tgl:hover i{width:12px;height:12px;top:3px;left:3px}
.tgl.on{background:var(--acc);border-color:var(--acc)}
.tgl.on i{left:24px;background:var(--accfg)} .tgl.on:hover i{left:22px}
html.acc-neutral .tgl.on{background:var(--fg);border-color:var(--fg)} html.acc-neutral .tgl.on i{background:var(--bg)}
.tgl:disabled{opacity:.45;cursor:default}
</style>
</head>
<body>
<header>
  <h1 class="pywebview-drag-region">TaskHub</h1><span class="cnt pywebview-drag-region" id="cnt"></span>
  <span class="sp pywebview-drag-region" style="align-self:stretch"></span>
  <div class="tabs"><button data-f="active" class="on" data-i="active"></button><button data-f="all" data-i="all"></button></div>

// relative luminance -> black or white text on the accent colour (WCAG: whichever contrasts more)
function lum(h){ const m=/^#([0-9a-f]{6})$/i.exec(h||""); if(!m) return 0; const n=parseInt(m[1],16);
  const c=[n>>16&255,n>>8&255,n&255].map(v=>{ v/=255; return v<=0.03928? v/12.92 : Math.pow((v+0.055)/1.055,2.4); });
  return 0.2126*c[0]+0.7152*c[1]+0.0722*c[2]; }
// colourfulness 0..1 (max - min of the RGB channels): a grey accent is close to 0
function chroma(h){ const n=parseInt(h.slice(1),16), c=[n>>16&255,n>>8&255,n&255]; return (Math.max(...c)-Math.min(...c))/255; }
function applyLook(){
  const r=document.documentElement, st=r.style;
  if (PANEL.theme==="light"||PANEL.theme==="dark") r.dataset.theme=PANEL.theme; else delete r.dataset.theme;
  const acc = PANEL.accent==="system" && LOOK && /^#[0-9a-f]{6}$/i.test(LOOK.accent||"") ? LOOK.accent : "";
  if (acc){ st.setProperty("--acc",acc); st.setProperty("--accfg", lum(acc)>0.179?"#000":"#fff"); }
  else { st.removeProperty("--acc"); st.removeProperty("--accfg"); }
  r.classList.toggle("acc-neutral", !!acc && chroma(acc)<0.12);
  const bd=!!(LOOK && LOOK.backdrop), pct=v=>Math.max(0,Math.min(100,+v||0));
  const tr=bd? pct(PANEL.panel_transparency) : 0, ctr=bd? pct(PANEL.card_transparency) : 0;
  // the panel's and the cards' own tint; at 100 % nothing but the blur of the windows behind is left
  st.setProperty("--alpha",(100-tr)+"%"); st.setProperty("--calpha",(100-ctr)+"%");
  // the less of the tint is left under the text, the stronger its halo (header: the panel only; cards: panel and card)
  const see=tr*ctr/100;
  st.setProperty("--halo",Math.round(Math.min(90,see*1.1))+"%"); st.setProperty("--hhalo",Math.round(Math.min(90,tr*1.1))+"%");

  th.value=PANEL.theme; document.getElementById("accent").value=PANEL.accent; document.getElementById("grp").value=PANEL.panel_group||"project";
  for (const [id,key] of [["transp","panel_transparency"],["ctransp","card_transparency"]]){
    const s=document.getElementById(id); if (document.activeElement!==s) s.value=PANEL[key];

}

  return coarse ? p[0] : p.join(" "); }

function lvl(w, v){ // threshold color
  if (typeof v!=="number") return "";

  if (w.crit!=null && (inv? v<=w.crit : v>=w.crit)) return "var(--red)";
  if (w.warn!=null && (inv? v<=w.warn : v>=w.warn)) return "var(--amber)";
  return cssc(w.color);

function lab(w, right=""){ return w.label||right ? `<div class="lb"><span>${esc(w.label)}</span>${right?`<span class="lv">${right}</span>`:""}</div>` : ""; }
const W = {
  text(w){ return lab(w) + `<div class="v ${w.mono?"mono":""}">${esc(w.value ?? "—")}</div>`; },
  progress(w){
    let v=w.value, tot=w.total ?? w.max, f=null, txt="";
    if (typeof v==="number"){ if (tot){ f=v/tot; txt=`${num(v)} / ${num(tot)} ${esc(w.unit)}`; } else { f = v>1? v/100 : v; txt=(f*100).toFixed(1)+"%"; } }
    if (f!=null && tot) txt += ` · ${(f*100).toFixed(0)}%`;
    f = f==null?0:Math.max(0,Math.min(1,f));
    return lab(w, txt) + `<div class="pb" style="--wc:${lvl(w,f*100)||"var(--acc)"}"><i style="width:${(f*100).toFixed(2)}%"></i></div>`;
  },
  gauge(w){
    const v=w.value, mn=w.min??0, mx=w.max??100, f=typeof v==="number"?Math.max(0,Math.min(1,(v-mn)/(mx-mn||1))):0;
    const R=34, cx=44, cy=40, a0=Math.PI, a1=Math.PI*(1-f);
    const P=a=>[cx+R*Math.cos(a), cy-R*Math.sin(a)];
    const [x0,y0]=P(a0),[x1,y1]=P(a1),[xe,ye]=P(0);
    const col=lvl(w,v)||"var(--acc)";
    return `<div style="display:flex;align-items:center;gap:8px">
      <svg viewBox="0 0 88 46" width="88" height="46"><path d="M${x0},${y0} A${R},${R} 0 0 1 ${xe},${ye}" fill="none" stroke="var(--o2)" stroke-width="8" stroke-linecap="round"/>
      ${f>0.002?`<path d="M${x0},${y0} A${R},${R} 0 0 1 ${x1.toFixed(2)},${y1.toFixed(2)}" fill="none" stroke="${col}" stroke-width="8" stroke-linecap="round"/>`:""}</svg>
      <div style="min-width:0">${lab(w)}<div class="big" style="color:${lvl(w,v)||"inherit"}">${num(v,w.decimals)}<small>${esc(w.unit)}</small></div></div></div>`;
  },
  stat(w){
    const v=w.value; let d="";

      const up=v>w.prev, good=w.invert? !up : up;
      d=`<span class="dl ${good?"up":"dn"}">${up?"▲":"▼"} ${num(Math.abs(v-w.prev))}</span>`; }
    return lab(w) + `<div class="big" style="color:${lvl(w,v)||"inherit"}">${num(v,w.decimals)}<small>${esc(w.unit)}</small>${d}</div>`;
  },
  led(w){
    let v=w.value, txt=w.text, cls="off";

  },
  kv(w){
    const o=w.value||{}; return lab(w)+`<div class="kv">${Object.entries(o).map(([k,v])=>`<span>${esc(k)}</span><span>${typeof v==="number"?num(v,w.decimals):esc(v)}</span>`).join("")}</div>`;
  },
  table(w){
    const rows=(w.value||[]).slice(-50), cols=w.columns&&w.columns.length?w.columns:(rows[0]&&!Array.isArray(rows[0])?Object.keys(rows[0]):[]);
    const cell=v=>typeof v==="number"?num(v,w.decimals):esc(v);
    if (!rows.length) return lab(w)+`<div class="v wait">${T("waiting")}</div>`;
    return lab(w)+`<table class="tb">${cols.length?`<tr>${cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr>`:""}
      ${rows.map(r=>`<tr>${(Array.isArray(r)?r:cols.map(c=>r[c])).map(v=>`<td>${cell(v)}</td>`).join("")}</tr>`).join("")}</table>`;

    const right = last ? S.map((s,i)=> last[i+1]==null?"":`${S.length>1?esc(s)+" ":""}${num(last[i+1],w.decimals)}`).filter(Boolean).join(" · ")+(w.unit?" "+esc(w.unit):"") : "";

        g+=`<path d="${d}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`;
      }

    const legend = S.length>1 ? `<div class="lg">${S.map((s,i)=>`<span><i style="background:var(--s${i%6+1})"></i>${esc(s)}</span>`).join("")}</div>` : "";

  },
};
function renderWidgets(t){
  const ws=t.widgets||[]; let html="";
  for (const w of ws){
    const f=W[w.type]||W.text, wide = w.span===2 || (["chart","table","kv","progress"].includes(w.type) && w.span!==1);
    let inner; try{ inner=f(w); }catch(e){ inner=`<div class="v">widget error: ${esc(e.message)}</div>`; }
    html += `<div class="w ${wide?"span2":""}">${inner}</div>`;

}

const setBox=$("#set");
let SET=null, setTimer=0;
const setOpen=()=>document.body.classList.contains("setmode");
function openSet(){ document.body.classList.add("setmode"); renderSet(); $("#set .sc").focus({preventScroll:true});   // keys scroll the page
  if (NATIVE){ host({settings:"get"}); clearInterval(setTimer); setTimer=setInterval(()=>{ if (setOpen()) host({settings:"get"}); },3000); } }
function closeSet(){ if (!setOpen()) return; document.body.classList.remove("setmode"); clearInterval(setTimer); }
$("#cfg").onclick=()=>setOpen()? closeSet() : openSet();
$("#setback").onclick=closeSet;
const HL=(k,f)=>(SET && SET.labels && SET.labels[k]) || f || k;
const tgl=(k,on,extra)=>`<button class="tgl${on?" on":""}" role="switch" aria-checked="${on?"true":"false"}" data-k="${k}"${extra||""}><i></i></button>`;
const srow=(title,desc,ctl,cls)=>(ctl=(ctl||"").replace('<button class="tgl',`<button aria-label="${esc(title)}" class="tgl`),   // a switch is named by its row
  `<div class="srow${cls?" "+cls:""}"><div class="sl"><div>${esc(title)}</div>${desc?`<div class="sd">${esc(desc)}</div>`:""}</div>${ctl}</div>`);
const sbtn=(what,txt,cls)=>`<button class="btn${cls?" "+cls:""}" data-do="${what}">${esc(txt)}</button>`;
const ckey=e=>[e.dataset.do,e.dataset.k,e.dataset.agent,e.dataset.kind].join("|");
function renderSet(){
  const box=$("#sethost"); if (!box || !setOpen()) return;
  const s=NATIVE? SET : null, muted=data? !!data.muted : !!(s && s.muted);
  const sec=(t,rows,note)=>`<h3>${esc(t)}</h3><div class="scard">${rows}</div>`+(note?`<div class="sd" style="margin:5px 4px 0">${esc(note)}</div>`:"");
  const mute=srow(HL("mute",T("notif_off")), T(muted?"s_mute_on":"s_mute_off"), tgl("muted",muted));
  let h;
  if (!s) h=sec(T("sec_notif"),mute);   // the browser page: only what the HTTP API allows
  else {
    const tg=s.telegram, up=s.updates;
    // turned off in Windows (Settings › Notifications): toasts vanish silently, so say it and offer the switch
    const winOff=/^disabled/.test(s.notifications||"")? srow(T("s_win_off"),T("s_win_off_d"),sbtn("notif_settings",T("s_open"))) : "";
    h=sec(T("sec_notif"), winOff + mute + srow(HL("test_toast"),"",sbtn("test_toast",T("s_send")))
      + (tg? srow("Telegram", tg.linked? [tg.bot?"@"+tg.bot:"",T("s_linked")].filter(Boolean).join(" · ")
          : tg.configured? (tg.status||T("s_not_linked")) : T("s_off"), sbtn("telegram",T("s_setup")))
          + (tg.warning? srow("⚠ "+tg.warning,"","","sub") : "") : ""));
    h+=sec(HL("connectors"), (s.connectors||[]).map(c=>srow(c.name, !c.enabled? T("s_off")
        : [c.account, c.status && c.status!=="ok"? c.status : "", c.items? T("s_watching",c.items) : ""].filter(Boolean).join(" · ") || T("s_on"),
        sbtn(c.id,T("s_setup")))).join(""), T("s_conn_note"));
    h+=sec(HL("integrations"), (s.agents||[]).map(a=>srow(a.name, a.detected? "" : T("s_not_found"), "")
        + ["hooks","mcp"].map(k=>srow(HL("menu_"+k),"",tgl("agent",a[k],` data-agent="${a.agent}" data-kind="${k}"`),"sub")).join("")).join(""));
    h+=sec(T("sec_system"), srow(HL("autostart"),"",tgl("autostart",s.autostart))
      + (up? srow(HL("updates"), "", up.available? sbtn("update_open",HL("update_to"),"primary") : sbtn("update_check_now",HL("update_check_now")))
           + srow(HL("update_auto"),"",tgl("update_check",up.auto),"sub")
           : srow(HL("updates"), T("s_store_upd"), ""))
      + srow(HL("data_folder"),"",sbtn("data_folder",T("s_open")))
      + srow(HL("api_help"),"",sbtn("api_help",T("s_open"))));
    h+=sec(T("sec_about"), srow("TaskHub "+s.version, T(s.edition==="store"?"s_ed_store":"s_ed_github"), sbtn("support",HL("support"),"heart")));
  }
  if (box.__h===h) return;
  // keep the focus on the same control across a re-render (the state comes back every few seconds)
  const f=document.activeElement, fk=f && box.contains(f) ? ckey(f) : null;
  box.innerHTML=h; box.__h=h;
  if (fk) for (const e of box.querySelectorAll("button")) if (ckey(e)===fk){ e.focus({preventScroll:true}); break; }
}
$("#sethost").addEventListener("click",e=>{
  const t=e.target.closest("button"); if (!t || t.disabled) return;
  if (t.dataset.do){ host({settings:"do",what:t.dataset.do}); return; }
  const k=t.dataset.k, on=!t.classList.contains("on");
  t.classList.toggle("on",on); t.setAttribute("aria-checked",on?"true":"false");   // at once; the host's reply confirms or reverts
  e.currentTarget.__h=null;   // the next render (reply / poll) redraws even if the state did not change - a failed change flips back
  if (k==="muted" && !NATIVE){ api("POST","/api/settings",{muted:on}).catch(er=>snack(er.message)).finally(()=>setTimeout(renderSet,300)); return; }
  if (k==="agent") host({settings:"set",agent:t.dataset.agent,kind:t.dataset.kind,on});
  else host({settings:"set",[k]:on});
});
function settingsReply(d){
  SET=d.settings_state; renderSet();
  if (d.error || d.note) ask(d.error || d.note, true);
}
const setPanel=b=>api("POST","/api/settings",b).then(r=>{ if(r.panel){ PANEL=r.panel; applyLook(); } }).catch(e=>snack(e.message));
$("#theme").onchange=e=>setPanel({theme:e.target.value});
$("#accent").onchange=e=>setPanel({accent:e.target.value});
$("#grp").onchange=e=>setPanel({panel_group:e.target.value});
$("#transp").oninput=e=>{ PANEL.panel_transparency=+e.target.value; applyLook(); };
$("#transp").onchange=e=>setPanel({panel_transparency:+e.target.value});
$("#ctransp").oninput=e=>{ PANEL.card_transparency=+e.target.value; applyLook(); };
$("#ctransp").onchange=e=>setPanel({card_transparency:+e.target.value});
$("#pin").onclick=()=>setPanel({panel_pinned:!PANEL.panel_pinned});
window.addEventListener("blur",()=>{
  if (!AUTOHIDE || NATIVE) return;   // the native host hides itself on deactivation
  setTimeout(async ()=>{
    if (document.hasFocus() || modal || Object.values(ui).some(u=>u.formFor)) return;
    try{ const r=await api("POST","/api/ui/hide",{}); if (!r.hidden) window.close(); }catch(e){ window.close(); }
  }, 250);
});
/* ---------------- overlay scrollbar ---------------- */
const SC=$("#list"), SB=$("#sb"), THUMB=$("#sb i");
let sbHide=0, sbHover=false, sbDrag=null;
function sbUpd(){
  const h=SC.clientHeight, H=SC.scrollHeight, top=SC.scrollTop, more=H-h;
  SC.classList.toggle("ft", top>1); SC.classList.toggle("fb", more-top>1);
  if (more<=1){ SB.classList.add("none"); return; }
  SB.classList.remove("none");
  const r=SC.getBoundingClientRect(); SB.style.top=r.top+"px"; SB.style.height=h+"px";
  const th=Math.max(28, h*h/H); THUMB.style.height=th+"px"; THUMB.style.transform=`translateY(${((h-th)*top/more).toFixed(1)}px)`;
}
function sbShow(){ SB.classList.add("on"); clearTimeout(sbHide); sbHide=setTimeout(()=>{ if(!sbHover && !sbDrag) SB.classList.remove("on"); }, 900); }
SC.addEventListener("scroll",()=>{ sbUpd(); sbShow(); },{passive:true});
document.addEventListener("mousemove",e=>{ if (e.clientX>=innerWidth-18 && !SB.classList.contains("none")) sbShow(); },{passive:true});
SB.addEventListener("mouseenter",()=>{ sbHover=true; sbShow(); });
SB.addEventListener("mouseleave",()=>{ sbHover=false; sbShow(); });
SB.addEventListener("pointerdown",e=>{
  if (e.button!==0) return; e.preventDefault();
  const h=SC.clientHeight, H=SC.scrollHeight, th=THUMB.offsetHeight, tr=THUMB.getBoundingClientRect();
  if (e.target!==THUMB){ SC.scrollBy({top:(e.clientY<tr.top?-1:1)*h*0.9}); return; }   // track: a page up / down
  sbDrag={y:e.clientY, top:SC.scrollTop, k:(H-h)/Math.max(1,h-th)}; SB.classList.add("drag"); SB.setPointerCapture(e.pointerId);
});
SB.addEventListener("pointermove",e=>{ if (sbDrag) SC.scrollTop=sbDrag.top+(e.clientY-sbDrag.y)*sbDrag.k; });
const sbEnd=()=>{ if (!sbDrag) return; sbDrag=null; SB.classList.remove("drag"); sbShow(); };
SB.addEventListener("pointerup",sbEnd); SB.addEventListener("pointercancel",sbEnd);
new ResizeObserver(sbUpd).observe(SC);
new MutationObserver(()=>requestAnimationFrame(sbUpd)).observe(SC,{childList:true,subtree:true,attributes:true,attributeFilter:["open","class","style"]});
document.addEventListener("toggle",()=>requestAnimationFrame(sbUpd),true);
// keys (arrows, Page Up/Down, Home/End, Space) scroll the list unless a control has the focus
window.addEventListener("focus",()=>{ if (document.activeElement===document.body) SC.focus({preventScroll:true}); });
document.addEventListener("mousedown",e=>{ if (!e.target.closest("button,input,select,textarea,a,summary,#set,#sb")) setTimeout(()=>{ if (document.activeElement===document.body) SC.focus({preventScroll:true}); }); });
setInterval(()=>{ if(!data) return; for(const t of data.tasks){ const el=document.getElementById("t-"+t.id); if(el) $(".tm",el).textContent=times(t);} },1000);
setInterval(()=>{ if (data) render(); },30000);   // "5 min ago", history and attention move with the clock
try{ if(localStorage.th_f) filt=localStorage.th_f; }catch(e){}
if (NATIVE){ document.documentElement.classList.add("native"); try{ window.chrome.webview.addEventListener("message",e=>{ const d=e.data; if(d && d.look){ LOOK=d.look; applyLook(); }
  if(d && d.shown) panelShown(true);
  if(d && d.paint){ requestAnimationFrame(()=>requestAnimationFrame(()=>host("painted"))); }
  if(d && d.open_settings) openSet();
  if(d && d.settings_state) settingsReply(d);
  if(d && d.hidden){ panelShown(false); closeSet(); const a=document.activeElement; if (a && a.closest && a.closest("header,#set")) a.blur(); } }); }catch(e){} host("look"); }
else { for (const id of ["transpl","transpr","ctranspl","ctranspr"]) $("#"+id).style.display="none"; }
applyLang();
$("#lang").onchange=e=>api("POST","/api/settings",{language:e.target.value}).catch(err=>snack(err.message));
setFilt(filt); loop();
if (location.hash.length>1) setTimeout(()=>flash(location.hash.slice(1)),600);
</script>
</body>
</html>
