ShortDescription: Tray hub for long-running jobs and AI-agent tasks - progress, notifications, charts and controls over a local API.
Description: |-
  TaskHub shows everything that runs in the background on your PC - training runs, renders, builds, backups and the
  scripts your AI agents start - in a tray icon with a progress ring, Windows notifications and a panel with live
  charts and the task's own buttons. Processes report over a local HTTP API (127.0.0.1 only), the taskhub CLI, MCP
  (Claude Code, Codex) or a Python client. Optional: Telegram bot, GitHub Actions, Runpod and Vast.ai connectors.
